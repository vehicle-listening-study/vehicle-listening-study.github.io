<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Study</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{font:16px system-ui;background:#eef4ef;color:#172b29}#status{padding:32px}iframe{display:block}</style></head><body><p id="status" role="status">Loading the listening study…</p><iframe id="study" title="Vehicle sound listening study" allow="autoplay" hidden></iframe><script type="module">const status=document.getElementById('status'),frame=document.getElementById('study');try{const config=await(await fetch('./config.json',{cache:'no-store'})).json();if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(config.backendUrl))throw new Error('The study connection is being configured. Please check back shortly.');frame.src=config.backendUrl;frame.hidden=false;frame.addEventListener('load',()=>{status.hidden=true});}catch(error){status.textContent=error.message}</script></body></html>
